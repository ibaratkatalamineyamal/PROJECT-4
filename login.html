<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onet Pixel Zoo - Masuk</title>
<link rel="icon" type="image/png" href="./assets/sprites/favicon.png?v=2">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body class="page-login">
<header class="navbar arcade"><div id="navbar"></div></header>
<main class="arcade"><div class="arcade-inner">
 <div class="marquee"><h1>🕹️ PLAYER LOGIN</h1><span class="sub">MASUK KE AKUNMU</span></div>
 <form id="form" class="auth-panel" autocomplete="off" novalidate>
  <div class="field"><label for="username">▸ USERNAME</label><input id="username" type="text" maxlength="12" autocomplete="username"></div>
  <div class="field"><label for="password">▸ PASSWORD</label><input id="password" type="password" autocomplete="current-password"></div>
  <button type="submit" class="start-btn">▶ MASUK</button>
  <div id="msg" class="form-msg" role="alert" aria-live="polite"></div>
  <a href="register.html" class="auth-toggle">▸ BELUM PUNYA AKUN? DAFTAR</a>
 </form>
 <p class="auth-note">Akun dan skor tersimpan di browser ini.<br>Logout tidak menghapus data.</p>
</div></main>
<script src="js/core/util.js"></script>
<script src="js/core/storage.js"></script>
<script src="js/core/auth.js"></script>
<script src="js/core/scores.js"></script>
<script src="js/core/ui.js"></script>
<script src="js/pages/login.js"></script>
</body>
</html>
